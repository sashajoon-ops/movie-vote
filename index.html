<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Vote</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background: #0f0f0f;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      padding: 20px;
      min-height: 100vh;
    }
    
    .container {
      max-width: 700px;
      margin: 0 auto;
    }
    
    .header {
      text-align: center;
      margin-bottom: 40px;
      border-bottom: 1px solid #333;
      padding-bottom: 20px;
    }
    
    h1 {
      font-size: 36px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    
    .subtitle {
      font-size: 14px;
      color: #aaa;
    }
    
    .card {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 20px;
    }
    
    .label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #ddd;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      background: #0f0f0f;
      border: 1px solid #333;
      border-radius: 6px;
      color: #fff;
      margin-bottom: 16px;
      box-sizing: border-box;
    }
    
    .movie-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
    }
    
    .movie-card {
      padding: 12px;
      background: #0f0f0f;
      border: 1px solid #333;
      border-radius: 6px;
      font-size: 13px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .movie-card:active {
      background: #222;
      border-color: #d4a574;
    }
    
    .ranking-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: #0f0f0f;
      border: 1px solid #333;
      border-radius: 6px;
      margin-bottom: 8px;
    }
    
    .rank-number {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      background: #d4a574;
      color: #000;
      font-weight: 700;
      border-radius: 50%;
      flex-shrink: 0;
    }
    
    .remove-btn {
      margin-left: auto;
      background: none;
      border: none;
      color: #666;
      cursor: pointer;
      padding: 4px;
      font-size: 14px;
    }
    
    .button {
      width: 100%;
      padding: 12px 16px;
      font-size: 16px;
      font-weight: 600;
      background: #d4a574;
      color: #000;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: opacity 0.2s;
