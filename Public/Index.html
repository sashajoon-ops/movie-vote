<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Vote</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background: #0f0f0f;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      padding: 20px;
      min-height: 100vh;
    }
    
    .container {
      max-width: 700px;
      margin: 0 auto;
    }
    
    .header {
      text-align: center;
      margin-bottom: 40px;
      border-bottom: 1px solid #333;
      padding-bottom: 20px;
    }
    
    h1 {
      font-size: 36px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    
    .subtitle {
      font-size: 14px;
      color: #aaa;
    }
    
    .card {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 20px;
    }
    
    .label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #ddd;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      background: #0f0f0f;
      border: 1px solid #333;
      border-radius: 6px;
      color: #fff;
      margin-bottom: 16px;
      box-sizing: border-box;
    }
    
    .movie-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
    }
    
    .movie-card {
      padding: 12px;
      background: #0f0f0f;
      border: 1px solid #333;
      border-radius: 6px;
      font-size: 13px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .movie-card:active {
      background: #222;
      border-color: #d4a574;
    }
    
    .ranking-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: #0f0f0f;
      border: 1px solid #333;
      border-radius: 6px;
      margin-bottom: 8px;
    }
    
    .rank-number {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      background: #d4a574;
      color: #000;
      font-weight: 700;
      border-radius: 50%;
      flex-shrink: 0;
    }
    
    .remove-btn {
      margin-left: auto;
      background: none;
      border: none;
      color: #666;
      cursor: pointer;
      padding: 4px;
      font-size: 14px;
    }
    
    .button {
      width: 100%;
      padding: 12px 16px;
      font-size: 16px;
      font-weight: 600;
      background: #d4a574;
      color: #000;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-bottom: 12px;
    }
    
    .button:active {
      opacity: 0.9;
    }
    
    .button-secondary {
      background: transparent;
      color: #d4a574;
      border: 1px solid #d4a574;
    }
    
    .empty {
      padding: 16px;
      color: #666;
      text-align: center;
      font-size: 14px;
    }
    
    .vote-count {
      text-align: center;
      font-size: 13px;
      color: #888;
      margin-bottom: 16px;
    }
    
    .hidden {
      display: none;
    }

    .winner-card {
      background: #1a1a1a;
      border: 2px solid #d4a574;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      margin-bottom: 24px;
    }

    .winner-label {
      font-size: 13px;
      color: #d4a574;
      font-weight: 600;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .winner-name {
      font-size: 28px;
      font-weight: 700;
      margin: 0;
    }

    .round {
      margin-bottom: 24px;
    }

    .round-title {
      font-size: 13px;
      font-weight: 600;
      color: #d4a574;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .result-row {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .result-label {
      min-width: 140px;
      font-weight: 500;
    }

    .result-bar {
      flex: 1;
      height: 6px;
      background: #0f0f0f;
      border-radius: 3px;
      overflow: hidden;
    }

    .result-bar-fill {
      height: 100%;
      background: #d4a574;
    }

    .result-count {
      min-width: 50px;
      text-align: right;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🎬 Movie Vote</h1>
      <p class="subtitle">Rank your favorites</p>
    </div>

    <div id="votingPhase">
      <div class="card">
        <label class="label">Your name</label>
        <input type="text" id="voterName" placeholder="Enter your name">

        <div class="label">Haven't seen (tap to add to ranking)</div>
        <div class="movie-grid" id="moviesGrid"></div>

        <div class="label">Your ranking (in order)</div>
        <div id="rankingContainer"></div>

        <button class="button" onclick="submitVote()">Submit vote</button>

        <div class="vote-count" id="voteCount"></div>
      </div>
    </div>

    <div id="resultsPhase" class="hidden">
      <div class="card">
        <div id="winnerSection"></div>
        <div id="roundsSection"></div>
        <button class="button button-secondary" onclick="location.reload()">New vote</button>
      </div>
    </div>
  </div>

  <script>
    const movies = [
      'Roman Holiday',
      'Dog Day Afternoon',
      'Casino Royale',
      'From Russia with Love',
      'Sunset Boulevard',
      'The French Connection',
      'Michael Clayton',
      'Grease',
      'The Straight Story',
      'C\'Mon C\'Mon',
      'Cabaret',
      'Marie Antoinette',
      'The Dink',
    ];

    let currentRanking = [];

    const API_BASE = window.location.origin;

    async function initVoting() {
      renderMovieGrid();
      await updateVoteCount();
    }

    function renderMovieGrid() {
      const grid = document.getElementById('moviesGrid');
      grid.innerHTML = movies
        .filter(m => !currentRanking.includes(m))
        .map(m => `
          <div class="movie-card" onclick="addToRanking('${m}')">
            ${m}
          </div>
        `).join('');
    }

    function addToRanking(title) {
      if (!currentRanking.includes(title)) {
        currentRanking.push(title);
        renderRanking();
        renderMovieGrid();
      }
    }

    function removeFromRanking(title) {
      currentRanking = currentRanking.filter(m => m !== title);
      renderRanking();
      renderMovieGrid();
    }

    function renderRanking() {
      const container = document.getElementById('rankingContainer');
      if (currentRanking.length === 0) {
        container.innerHTML = '<div class="empty">Tap movies to rank them</div>';
        return;
      }
      container.innerHTML = currentRanking.map((m, i) => `
        <div class="ranking-item">
          <div class="rank-number">${i + 1}</div>
          <span>${m}</span>
          <button class="remove-btn" onclick="removeFromRanking('${m}')">✕</button>
        </div>
      `).join('');
    }

    async function updateVoteCount() {
      try {
        const response = await fetch(`${API_BASE}/api/votes`);
        const data = await response.json();
        
        document.getElementById('voteCount').textContent = `${data.totalVotes}/8 votes submitted`;
        
        if (data.ready) {
          showResults(data);
        }
      } catch (error) {
        console.error('Error fetching votes:', error);
      }
    }

    async function submitVote() {
      const name = document.getElementById('voterName').value.trim();
      if (!name) {
        alert('Enter your name');
        return;
      }
      if (currentRanking.length === 0) {
        alert('Rank at least one movie');
        return;
      }

      try {
        const response = await fetch(`${API_BASE}/api/votes`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ voter: name, ranking: currentRanking })
        });

        const data = await response.json();
        
        if (response.ok) {
          alert('Vote submitted!');
          document.getElementById('voterName').value = '';
          currentRanking = [];
          renderRanking();
          renderMovieGrid();
          await updateVoteCount();
        } else {
          alert('Error submitting vote');
        }
      } catch (error) {
        console.error('Error:', error);
        alert('Error submitting vote');
      }
    }

    function showResults(data) {
      let winnerHtml = '';
      if (data.winner) {
        winnerHtml = `
          <div class="winner-card">
            <p class="winner-label">The winner is</p>
            <h2 class="winner-name">${data.winner}</h2>
          </div>
        `;
      }

      let roundsHtml = '<p class="label">Round-by-round</p>';
      data.rounds.forEach((round, roundIdx) => {
        roundsHtml += `<div class="round"><p class="round-title">Round ${roundIdx + 1}</p>`;
        round.remaining.forEach(movie => {
          const count = round.votes[movie] || 0;
          const pct = data.totalVotes > 0 ? Math.round((count / data.totalVotes) * 100) : 0;
          roundsHtml += `
            <div class="result-row">
              <div class="result-label">${movie}</div>
              <div class="result-bar">
                <div class="result-bar-fill" style="width: ${Math.max(pct, 5)}%;"></div>
              </div>
              <span class="result-count">${count} (${pct}%)</span>
            </div>
          `;
        });
        roundsHtml += '</div>';
      });

      document.getElementById('winnerSection').innerHTML = winnerHtml;
      document.getElementById('roundsSection').innerHTML = roundsHtml;
      document.getElementById('votingPhase').classList.add('hidden');
      document.getElementById('resultsPhase').classList.remove('hidden');
    }

    setInterval(updateVoteCount, 2000);

    window.addEventListener('load', initVoting);
  </script>
</body>
</html>
